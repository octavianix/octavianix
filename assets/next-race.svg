<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Next race: round 18, United States Grand Prix, Circuit of the Americas · Austin, USA, 25 October 2026, in 8 days">
<defs><clipPath id="c"><rect width="1000" height="130" rx="14"/></clipPath>
<pattern id="cf" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#fff" fill-opacity=".025"/></pattern></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.2px;fill:#8b8b96}
.t{font-size:24px;font-weight:700;fill:#f5f5f7} .p{font-size:13px;fill:#b9b9c3} .d{font-size:15px;font-weight:600;fill:#f5f5f7}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1.4px;fill:#fff;font-weight:700}
.dot{animation:bl 1s ease-in-out infinite alternate}@keyframes bl{to{opacity:.2}}
